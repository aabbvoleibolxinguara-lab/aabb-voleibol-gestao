<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#052c54">

  <title>AABB Voleibol • Gestão Esportiva</title>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f4f7fb;
    }

    #aabb-app {
      width: 100%;
      height: 100vh;
      border: 0;
      display: block;
      background: #fff;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: #f4f7fb;
      font-family: Arial, sans-serif;
      color: #052c54;
    }

    #loading.hidden {
      display: none;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid #dbe6f2;
      border-top-color: #0b5ca8;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div id="loading">
    <div class="spinner"></div>
    <strong>Abrindo AABB Voleibol...</strong>
    <span>Carregando sistema de gestão</span>
  </div>

  <iframe
    id="aabb-app"
    title="AABB Voleibol - Gestão"
    src="https://script.google.com/macros/s/AKfycbwaBB35vm_cwGZvhGMBnG-tmxCt4Ou-opBE1tcT3MspMpr_94vn52OWiR8P_XA5TsRw/exec"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script>
    document.getElementById('aabb-app').addEventListener('load', function () {
      document.getElementById('loading').classList.add('hidden');
    });
  </script>

</body>
</html>
